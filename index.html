<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3ee"><title>DOT — tiny interaction</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f3ee;color:#171717;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.top{position:fixed;top:0;left:0;right:0;height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;z-index:10}.brand{font-size:17px;font-weight:900;letter-spacing:-.08em}.counter{font:10px ui-monospace,monospace;color:#8b8a85}.hero{height:100svh;min-height:620px;display:grid;place-items:center;overflow:hidden;position:relative}.hello{text-align:center;position:relative;z-index:2}.hello small{font:10px ui-monospace,monospace;letter-spacing:.18em;color:#99968f}.hello h1{font-size:clamp(62px,19vw,110px);line-height:.82;letter-spacing:-.1em;margin:18px 0 20px}.hello p{font-size:14px;color:#77736c;line-height:1.6;margin:0}.dot{position:absolute;width:180px;height:180px;border-radius:50%;background:#171717;box-shadow:0 20px 70px #0002;transition:transform .18s cubic-bezier(.2,.8,.2,1);pointer-events:none}.dot:after{content:"";position:absolute;inset:10px;border:1px solid #fff2;border-radius:50%}.ring{position:absolute;width:310px;height:310px;border:1px solid #17171718;border-radius:50%;animation:spin 18s linear infinite}.hint{position:absolute;bottom:28px;left:0;right:0;text-align:center;font:10px ui-monospace,monospace;color:#aaa69f}.hint b{color:#171717}.section{padding:110px 18px}.intro{max-width:500px;margin:auto}.eyebrow{font:10px ui-monospace,monospace;color:#99968f}.intro h2{font-size:clamp(42px,12vw,70px);letter-spacing:-.09em;line-height:.9;margin:18px 0 24px}.intro p{color:#77736c;font-size:14px;line-height:1.8}.cards{display:grid;gap:10px;margin-top:60px}.card{min-height:150px;border:1px solid #dedbd3;border-radius:24px;padding:22px;display:flex;align-items:flex-end;justify-content:space-between;background:#f8f6f1;transition:.3s}.card:active{transform:scale(.98)}.card span{font:10px ui-monospace,monospace;color:#aaa69f}.card strong{font-size:28px;letter-spacing:-.07em}.final{height:90svh;min-height:540px;display:grid;place-items:center;text-align:center;padding:30px}.final h2{font-size:clamp(54px,16vw,100px);letter-spacing:-.1em;line-height:.82;margin:0}.final p{color:#8b8780;font-size:13px;margin-top:24px}.magic{border:0;background:#171717;color:#fff;border-radius:999px;padding:13px 19px;font-size:12px;margin-top:20px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#171717;color:#fff;border-radius:999px;padding:11px 16px;font:11px ui-monospace,monospace;opacity:0;transition:.3s;z-index:30;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.spark{position:fixed;width:8px;height:8px;border-radius:50%;background:#171717;pointer-events:none;animation:pop .7s ease-out forwards;z-index:20}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header class="top"><div class="brand">DOT.</div><div class="counter">00:00 / 03</div></header><main><section class="hero" id="hero"><div class="ring"></div><div class="dot" id="dot"></div><div class="hello"><small>A TINY WEB EXPERIMENT</small><h1>HELLO<br>THERE.</h1><p>화면을 톡 건드려봐.<br>별거 아닌데 조금 재밌어.</p></div><div class="hint">● <b>DRAG</b> · TAP · HOLD</div></section><section class="section"><div class="intro"><div class="eyebrow">01 / SIMPLE</div><h2>작은 움직임이<br>재미를 만든다.</h2><p>복잡한 기능 대신 하나의 오브젝트와 몇 가지 제스처만 남겼다. 모바일에서 바로 만져보고 이해할 수 있도록.</p><div class="cards"><div class="card"><span>01</span><strong>DRAG</strong></div><div class="card"><span>02</span><strong>HOLD</strong></div><div class="card"><span>03</span><strong>TAP × 2</strong></div></div></div></section><section class="final"><div><div class="eyebrow">03 / PLAY</div><h2>ONE MORE<br>TIME?</h2><p>버튼을 누르면 작은 일이 생긴다.</p><button class="magic" id="magic">MAKE A LITTLE MAGIC</button></div></section></main><div class="toast" id="toast">nice.</div><script>const dot=document.getElementById('dot'),toast=document.getElementById('toast');let down=0,moved=0;function place(x,y){dot.style.transform=`translate(${(x-innerWidth/2)*.34}px,${(y-innerHeight/2)*.34}px) scale(1.05)`}addEventListener('pointerdown',e=>{down=Date.now();moved=0;place(e.clientX,e.clientY)});addEventListener('pointermove',e=>{if(e.buttons){moved=1;place(e.clientX,e.clientY)}});addEventListener('pointerup',e=>{const held=Date.now()-down;if(held>500&&!moved)show('held it.');else if(!moved)show('tap.');});let last=0;addEventListener('pointerup',e=>{const now=Date.now();if(now-last<320){show('double tap!');burst(e.clientX,e.clientY)}last=now});function show(t){toast.textContent=t;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),900);if(navigator.vibrate)navigator.vibrate(12)}function burst(x,y){for(let i=0;i<10;i++){const s=document.createElement('i');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',Math.cos(i/10*Math.PI*2)*70+'px');s.style.setProperty('--y',Math.sin(i/10*Math.PI*2)*70+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}document.getElementById('magic').onclick=e=>{burst(e.clientX||innerWidth/2,e.clientY||innerHeight/2);show('✨ okay, that was nice.')};</script></body></html>
