<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07050d"><title>NEON//FLOW</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#07050d;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 20%,#ff2bd633,transparent 28%),radial-gradient(circle at 80% 35%,#00e5ff2b,transparent 30%),radial-gradient(circle at 50% 90%,#7c3cff25,transparent 32%)}.nav{position:fixed;top:0;left:0;right:0;z-index:30;height:64px;padding:0 18px;display:flex;justify-content:space-between;align-items:center;mix-blend-mode:screen}.logo{font-weight:1000;letter-spacing:-.09em}.live{font:9px ui-monospace,monospace;border:1px solid #ffffff2a;border-radius:99px;padding:8px 10px;color:#aaa}.live i{display:inline-block;width:5px;height:5px;background:#55ffb0;border-radius:50%;margin-right:5px;box-shadow:0 0 12px #55ffb0}.hero{height:100svh;min-height:650px;position:relative;display:grid;place-items:center;overflow:hidden}.orb{position:absolute;width:min(82vw,430px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0 1%,#ff9de9 3%,#ff2bd6 8%,#7c3cff 24%,#171126 52%,transparent 70%);box-shadow:0 0 50px #ff2bd677,0 0 150px #7c3cff55;animation:float 5s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;inset:-15%;border-radius:50%;border:1px solid #ff66e455;transform:rotate(25deg) scaleY(.45);animation:spin 8s linear infinite}.orb:after{inset:-30%;border-color:#00e5ff44;transform:rotate(-35deg) scaleY(.32);animation-duration:12s}.content{position:relative;z-index:4;text-align:center;padding:20px}.eyebrow{font:9px ui-monospace,monospace;letter-spacing:.25em;color:#ff8de8}.content h1{font-size:clamp(60px,18vw,112px);line-height:.8;letter-spacing:-.11em;margin:16px 0}.content h1 span{background:linear-gradient(90deg,#ff35d9,#9d6cff,#00e5ff);-webkit-background-clip:text;color:transparent}.content p{font-size:13px;line-height:1.7;color:#aaa;max-width:300px;margin:auto}.gesture{position:absolute;bottom:28px;font:9px ui-monospace,monospace;color:#666;z-index:4}.gesture b{color:#fff}.scene{min-height:100svh;padding:100px 18px;display:grid;align-items:center}.title{font-size:clamp(42px,13vw,80px);line-height:.85;letter-spacing:-.1em;margin:0 0 40px}.cards{display:grid;gap:12px}.card{min-height:180px;border:1px solid #ffffff18;border-radius:28px;padding:22px;position:relative;overflow:hidden;background:linear-gradient(145deg,#ffffff0c,#ffffff02);backdrop-filter:blur(14px);transition:.35s}.card:active{transform:scale(.97)}.card:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-30px;bottom:-30px;background:#ff2bd633;filter:blur(25px)}.card small{font:9px ui-monospace,monospace;color:#777}.card h2{font-size:38px;letter-spacing:-.08em;margin:52px 0 0}.final{min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px}.final h2{font-size:clamp(58px,17vw,110px);line-height:.78;letter-spacing:-.11em;margin:0}.final span{background:linear-gradient(90deg,#ff2bd6,#7c3cff,#00e5ff);-webkit-background-clip:text;color:transparent}.final p{color:#888;font-size:12px}.magic{border:1px solid #ffffff25;background:#ffffff0d;color:#fff;border-radius:99px;padding:15px 20px;margin-top:15px}.particle{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:50;background:var(--c);box-shadow:0 0 16px var(--c);animation:burst .8s ease-out forwards}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-14px) scale(1.03)}}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}@media(min-width:700px){.scene{max-width:1000px;margin:auto}.cards{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header class="nav"><div class="logo">NEON//FLOW</div><div class="live"><i></i>LIVE</div></header><main><section class="hero"><div class="orb" id="orb"></div><div class="content"><div class="eyebrow">MOBILE INTERACTIVE EXPERIENCE</div><h1>TOUCH<br><span>THE FLOW.</span></h1><p>화면을 움직이고, 누르고, 흔들어봐.<br>이 페이지는 손끝에 반응해.</p></div><div class="gesture">● <b>DRAG</b> · HOLD · DOUBLE TAP</div></section><section class="scene"><div><div class="eyebrow">01 — PLAY WITH IT</div><h2 class="title">작은 화면에<br>큰 반응.</h2><div class="cards"><article class="card"><small>01 / DRAG</small><h2>FOLLOW.</h2></article><article class="card"><small>02 / HOLD</small><h2>CHARGE.</h2></article><article class="card"><small>03 / TAP</small><h2>BURST.</h2></article></div></div></section><section class="final"><div><div class="eyebrow">02 — AGAIN</div><h2>MAKE IT<br><span>GLOW.</span></h2><p>한 번 더 눌러봐.</p><button class="magic" id="magic">✦ MAKE MAGIC</button></div></section></main><script>const orb=document.getElementById('orb');let down=0,moved=0,last=0;function move(x,y){const dx=(x-innerWidth/2)*.12,dy=(y-innerHeight/2)*.12;orb.style.transform=`translate(${dx}px,${dy}px) scale(1.06)`}function burst(x,y){const colors=['#ff2bd6','#00e5ff','#a66cff','#55ffb0','#fff'];for(let i=0;i<28;i++){const p=document.createElement('i');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--c',colors[i%colors.length]);const a=Math.PI*2*i/28,r=70+Math.random()*130;p.style.setProperty('--x',Math.cos(a)*r+'px');p.style.setProperty('--y',Math.sin(a)*r+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),800)}if(navigator.vibrate)navigator.vibrate([15,25,15])}addEventListener('pointerdown',e=>{down=Date.now();moved=0;move(e.clientX,e.clientY)});addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){moved=1;move(e.clientX,e.clientY)}});addEventListener('pointerup',e=>{const held=Date.now()-down;if(held>550&&!moved)burst(e.clientX,e.clientY);const now=Date.now();if(now-last<320)burst(e.clientX,e.clientY);last=now});document.getElementById('magic').onclick=e=>burst(e.clientX||innerWidth/2,e.clientY||innerHeight/2);</script></body></html>
